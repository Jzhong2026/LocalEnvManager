name: build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Build from the solution so a clean checkout catches files that were
      # accidentally hidden by .gitignore (the original Log/ regression).
      - name: Build
        run: dotnet build src/LocalEnvManager/LocalEnvManager.slnx -c Release -nologo

      - name: Test
        run: dotnet test src/LocalEnvManager/tests/LocalEnvManager.Tests/LocalEnvManager.Tests.csproj -c Release --no-build -nologo
